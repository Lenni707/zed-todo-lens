  "Proto", "Python", "R", "Racket", "Ruby", "Rust", "Scala", "Scheme", "SCSS", "Shell Script",
  "Solidity", "SQL", "Svelte", "Swift", "Terraform", "TOML", "TSX", "TypeScript", "Vue.js",
